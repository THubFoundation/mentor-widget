<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mentor AI Suggestions</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:sans-serif;font-size:13px;background:#fff;padding:16px}
#debug{background:#f5f5f5;border:1px solid #ddd;border-radius:4px;padding:12px;margin-bottom:16px;font-size:11px;font-family:monospace;white-space:pre-wrap;max-height:200px;overflow-y:auto}
#debug .ok{color:green} #debug .err{color:red} #debug .info{color:#0076c6}
</style>
</head>
<body>

<div id="debug">Initializing...\n</div>

<script src="https://js.zohostatic.com/zohocrm/sdk/2.0/ZohoCRMWidget.js"></script>
<script>
function log(msg, type) {
  const d = document.getElementById("debug");
  const line = document.createElement("div");
  line.className = type || "info";
  line.textContent = new Date().toISOString().substr(11,8) + " " + msg;
  d.appendChild(line);
  d.scrollTop = d.scrollHeight;
  console.log(msg);
}

log("Page loaded", "ok");

try {
  log("ZOHO object exists: " + (typeof ZOHO !== "undefined"));
  log("ZOHO.embeddedApp exists: " + (typeof ZOHO?.embeddedApp !== "undefined"));

  ZOHO.embeddedApp.on("PageLoad", function(data) {
    log("PageLoad fired! Data: " + JSON.stringify(data), "ok");
  });

  log("Registered PageLoad listener", "ok");
  ZOHO.embeddedApp.init();
  log("init() called", "ok");

} catch(e) {
  log("ERROR: " + e.message, "err");
}
</script>
</body>
</html>
